<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Perceptron: Logic Gate Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Perceptron</h1>
        <p class="subtitle">A single neuron learning a 2-input logic gate</p>
      </header>

      <div id="gate-selector" class="gate-selector">
        <button data-gate="AND">AND</button>
        <button data-gate="OR">OR</button>
        <button data-gate="NAND">NAND</button>
        <button data-gate="NOR">NOR</button>
        <button data-gate="XOR">XOR</button>
      </div>

      <div class="mode-tabs">
        <button id="mode-manual" class="mode-tab">Manual</button>
        <button id="mode-training" class="mode-tab">Training</button>
      </div>

      <table class="truth-table">
        <thead>
          <tr>
            <th>x1</th>
            <th>x2</th>
            <th>expected</th>
            <th>sum</th>
            <th>actual</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="truth-table-body"></tbody>
      </table>

      <p id="status" class="status"></p>

      <section id="manual-panel" class="panel">
        <h2>Weights &amp; bias</h2>
        <label class="slider-row">
          <span>w1</span>
          <input id="w1-slider" type="range" min="-2" max="2" step="0.01" />
          <span id="w1-value" class="value"></span>
        </label>
        <label class="slider-row">
          <span>w2</span>
          <input id="w2-slider" type="range" min="-2" max="2" step="0.01" />
          <span id="w2-value" class="value"></span>
        </label>
        <label class="slider-row">
          <span>bias</span>
          <input id="bias-slider" type="range" min="-2" max="2" step="0.01" />
          <span id="bias-value" class="value"></span>
        </label>
      </section>

      <section id="training-panel" class="panel">
        <h2>Learning</h2>
        <label class="slider-row">
          <span>rate</span>
          <input id="lr-slider" type="range" min="0.01" max="1" step="0.01" />
          <span id="lr-value" class="value"></span>
        </label>
        <div class="buttons">
          <button id="step-btn">Step</button>
          <button id="run-btn">Run</button>
          <button id="reset-btn">Reset</button>
        </div>
        <p class="epoch">Epoch <span id="epoch-count"></span></p>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
