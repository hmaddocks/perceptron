<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Perceptron: Logic Gate Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-active-view="table" data-mode="manual">
    <main class="app">
      <header class="app-header">
        <h1>Perceptron</h1>
        <p class="subtitle">A single neuron learning a 2-input logic gate</p>
        <a href="freeform.html" class="freeform-link">Freeform classifier demo →</a>
        <a href="xor-network.html" class="freeform-link">XOR network demo →</a>
      </header>

      <nav class="view-menu">
        <button data-view="table" id="view-table-btn">Truth Table</button>
        <button data-view="plane" id="view-plane-btn">Plane</button>
      </nav>

      <section id="table-view" class="view">
        <div class="gate-selector" data-role="gate-selector">
          <button data-role="gate-btn" data-gate="AND">AND</button>
          <button data-role="gate-btn" data-gate="OR">OR</button>
          <button data-role="gate-btn" data-gate="NAND">NAND</button>
          <button data-role="gate-btn" data-gate="NOR">NOR</button>
          <button data-role="gate-btn" data-gate="XOR">XOR</button>
        </div>

        <div class="mode-tabs">
          <button data-role="mode-manual" class="mode-tab">Manual</button>
          <button data-role="mode-training" class="mode-tab">Training</button>
        </div>

        <table class="truth-table">
          <thead>
            <tr>
              <th>x1</th>
              <th>x2</th>
              <th>expected</th>
              <th>sum</th>
              <th>actual</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="truth-table-body"></tbody>
        </table>

        <p data-role="status" class="status"></p>

        <section data-role="manual-panel" class="panel">
          <h2>Weights &amp; bias</h2>
          <label class="slider-row">
            <span>w1</span>
            <input data-role="w1-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="w1-value" class="value"></span>
          </label>
          <label class="slider-row">
            <span>w2</span>
            <input data-role="w2-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="w2-value" class="value"></span>
          </label>
          <label class="slider-row">
            <span>bias</span>
            <input data-role="bias-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="bias-value" class="value"></span>
          </label>
        </section>

        <section data-role="training-panel" class="panel">
          <h2>Learning</h2>
          <label class="slider-row">
            <span>rate</span>
            <input data-role="lr-slider" type="range" min="0.01" max="1" step="0.01" />
            <span data-role="lr-value" class="value"></span>
          </label>
          <div class="buttons">
            <button data-role="step-btn">Step</button>
            <button data-role="run-btn">Run</button>
            <button data-role="reset-btn">Reset</button>
          </div>
          <p class="epoch">Epoch <span data-role="epoch-count"></span></p>
          <p data-role="training-indicator" class="training-indicator"></p>
        </section>
      </section>

      <section id="plane-view" class="view">
        <div class="gate-selector" data-role="gate-selector">
          <button data-role="gate-btn" data-gate="AND">AND</button>
          <button data-role="gate-btn" data-gate="OR">OR</button>
          <button data-role="gate-btn" data-gate="NAND">NAND</button>
          <button data-role="gate-btn" data-gate="NOR">NOR</button>
          <button data-role="gate-btn" data-gate="XOR">XOR</button>
        </div>

        <div class="mode-tabs">
          <button data-role="mode-manual" class="mode-tab">Manual</button>
          <button data-role="mode-training" class="mode-tab">Training</button>
        </div>

        <div class="plane-wrap">
          <svg id="plane-svg" viewBox="0 0 400 400"></svg>
        </div>

        <p data-role="status" class="status"></p>

        <section data-role="manual-panel" class="panel">
          <h2>Weights &amp; bias</h2>
          <label class="slider-row">
            <span>w1</span>
            <input data-role="w1-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="w1-value" class="value"></span>
          </label>
          <label class="slider-row">
            <span>w2</span>
            <input data-role="w2-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="w2-value" class="value"></span>
          </label>
          <label class="slider-row">
            <span>bias</span>
            <input data-role="bias-slider" type="range" min="-2" max="2" step="0.01" />
            <span data-role="bias-value" class="value"></span>
          </label>
        </section>

        <section data-role="training-panel" class="panel">
          <h2>Learning</h2>
          <label class="slider-row">
            <span>rate</span>
            <input data-role="lr-slider" type="range" min="0.01" max="1" step="0.01" />
            <span data-role="lr-value" class="value"></span>
          </label>
          <div class="buttons">
            <button data-role="step-btn">Step</button>
            <button data-role="run-btn">Run</button>
            <button data-role="reset-btn">Reset</button>
          </div>
          <p class="epoch">Epoch <span data-role="epoch-count"></span></p>
          <p data-role="training-indicator" class="training-indicator"></p>
        </section>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
